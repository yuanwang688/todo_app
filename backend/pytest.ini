[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# `pytest` alone runs the unit tests only. The eval suite is opt-in via
# `pytest evals` — from Phase E it makes real API calls and costs money, so it
# must never run implicitly on every push.
testpaths = tests

markers =
    evals: assistant behaviour scenario (run with `pytest evals`)
